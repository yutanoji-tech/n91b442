<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>U Share タスクボード</title>
<style>
:root{
  --paper:#eef1f8; --surface:#ffffff; --surface-2:#f5f7fc; --line:#e2e6f0;
  --ink:#1e2233; --muted:#5d6478; --faint:#9aa1b5; --accent:#4f5bd5;
  --inbox:#8e4ec6; --inboxbg:#f6edfb;
  --q1:#e5484d; --q1bg:#fdecec; --q2:#3e63dd; --q2bg:#eaeffb;
  --q3:#d9820a; --q3bg:#fdf2df; --q4:#828aa3; --q4bg:#eef0f5;
  --gold:#f5a623; --good:#30a46c; --danger:#e5484d; --warn:#d9820a;
  --shadow:0 1px 2px rgba(30,40,90,.06), 0 4px 14px rgba(30,40,90,.06);
  --radius:13px;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#f0f3fb,#eef1f8); color:var(--ink); -webkit-font-smoothing:antialiased;
  line-height:1.45; display:flex; flex-direction:column; height:100vh; overflow:hidden}

header{flex:none; background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:9px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
h1{font-size:15px; margin:0; font-weight:800; letter-spacing:.01em; white-space:nowrap}
h1 small{font-weight:600; color:var(--faint); font-size:11px; margin-left:6px}
.gami{display:flex; align-items:center; gap:10px; font-size:13px}
.gami .lv{font-weight:800; color:var(--accent)}
.gami .lv b{font-size:16px}
.xpbar{width:130px; height:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.xpbar>div{height:100%; background:linear-gradient(90deg,#f5a623,#f6c453); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gami .xp{color:var(--muted); font-variant-numeric:tabular-nums}
.gami .today{color:var(--good); font-weight:700}
.gami .today b{font-size:15px}
.tools{margin-left:auto; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
button.btn{font:inherit; font-size:12.5px; padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
button.btn:hover{border-color:var(--accent); color:var(--accent)}
label.toggle{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap}
.stamp{font-size:11px; color:var(--faint); white-space:nowrap}

.hint{flex:none; color:var(--faint); font-size:12px; padding:6px 16px 0}

.board{flex:1; display:flex; gap:10px; padding:10px 16px 14px; overflow-x:auto; overflow-y:hidden; min-height:0}
.col{flex:1 1 0; min-width:210px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); min-height:0}
.col-head{flex:none; padding:9px 12px; border-bottom:1px solid var(--line); border-radius:var(--radius) var(--radius) 0 0;
  display:flex; align-items:baseline; gap:7px}
.col-head .badge{font-weight:800; font-size:13px}
.col-head .sub{font-size:10.5px; color:var(--faint)}
.col-head .cnt{margin-left:auto; font-size:12px; font-weight:700; color:var(--faint); font-variant-numeric:tabular-nums}
.col.inbox .col-head{background:var(--inboxbg)} .col.inbox .badge{color:var(--inbox)}
.col.q1 .col-head{background:var(--q1bg)} .col.q1 .badge{color:var(--q1)}
.col.q2 .col-head{background:var(--q2bg)} .col.q2 .badge{color:var(--q2)}
.col.q3 .col-head{background:var(--q3bg)} .col.q3 .badge{color:var(--q3)}
.col.q4 .col-head{background:var(--q4bg)} .col.q4 .badge{color:var(--q4)}
.list{flex:1; overflow-y:auto; padding:7px; display:flex; flex-direction:column; gap:6px; min-height:40px}
.list.dragover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.addbtn{flex:none; margin:0 7px 8px; font-size:12.5px; color:var(--accent); background:none; border:1px dashed var(--line);
  border-radius:8px; padding:5px; cursor:pointer}
.addbtn:hover{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,transparent)}

.card{background:var(--surface); border:1px solid var(--line); border-left-width:4px; border-radius:9px; padding:6px 8px;
  display:flex; flex-direction:column; gap:4px; transition:transform .1s, box-shadow .1s; cursor:grab}
.card:active{cursor:grabbing}
.card:hover{box-shadow:var(--shadow)}
.title[contenteditable="true"]{cursor:text}
.card.pri-高{border-left-color:var(--q1)} .card.pri-中{border-left-color:var(--q3)} .card.pri-低{border-left-color:var(--faint)}
.card.overdue{background:var(--q1bg); border-color:color-mix(in srgb,var(--q1) 45%,var(--line))}
.card.done{opacity:.5}
.card.done .title{text-decoration:line-through; color:var(--muted)}
.card.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.card .row1{display:flex; align-items:flex-start; gap:6px}
.handle{cursor:grab; color:var(--faint); font-size:13px; line-height:1.4; user-select:none; flex:none}
.chk{width:17px; height:17px; margin-top:1px; cursor:pointer; flex:none; accent-color:var(--good)}
.title{flex:1; font-size:13px; font-weight:600; outline:none; min-width:0; overflow-wrap:anywhere}
.title:focus{background:color-mix(in srgb,var(--accent) 9%,transparent); border-radius:4px}
.del{flex:none; border:none; background:none; color:var(--faint); cursor:pointer; font-size:14px; line-height:1; padding:0 2px}
.del:hover{color:var(--danger)}
.card.dragging{opacity:.4}
.meta{display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding-left:19px}
.meta select,.meta input[type=date]{font:inherit; font-size:10.5px; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:5px; padding:1px 3px}
.meta .due-late{color:#fff; background:var(--danger); border-color:var(--danger); font-weight:700}
.meta .due-soon{color:var(--warn); border-color:var(--warn); font-weight:700}
.flag{font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px; white-space:nowrap}
.flag.late{color:#fff; background:var(--danger)} .flag.today{color:var(--warn); border:1px solid var(--warn)}

.routine{flex:none; border-top:1px solid var(--line); background:var(--surface); padding:6px 16px; max-height:26vh; overflow-y:auto}
.routine summary{cursor:pointer; font-size:12px; font-weight:800; letter-spacing:.05em; color:var(--muted); list-style:none; padding:3px 0}
.routine summary::-webkit-details-marker{display:none}
.routine summary::before{content:"▸ "; color:var(--faint)}
.routine[open] summary::before{content:"▾ "}
.rlist{display:flex; flex-direction:column; gap:1px; margin-top:4px}
.ritem{display:flex; align-items:center; gap:8px; padding:4px 2px; border-bottom:1px solid var(--line)}
.ritem input[type=checkbox]{accent-color:var(--good); width:16px; height:16px}
.ritem .freq-sel{font:inherit; font-size:11px; border:1px solid var(--line); border-radius:99px; padding:1px 6px; background:var(--surface-2); color:var(--muted)}
.ritem .rtext{flex:1; outline:none; font-size:13px}
.ritem.done .rtext{text-decoration:line-through; color:var(--muted)}
.ritem .rnext{font-size:10.5px; color:var(--faint)}
.ritem .del{font-size:13px}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden}
.confetti-p{position:absolute; width:9px; height:9px; border-radius:2px; will-change:transform,opacity}
@media (max-width:700px){ .col{min-width:78vw} .gami .xpbar{width:80px} }
</style>
</head>
<body>
<header>
  <h1>U Share タスク<small id="stamp"></small></h1>
  <div class="gami">
    <span class="lv">Lv <b id="lv">1</b></span>
    <div class="xpbar"><div id="xpfill" style="width:0%"></div></div>
    <span class="xp"><b id="xp">0</b> XP</span>
    <span class="today">今日 <b id="todayc">0</b> 件 ⚡</span>
  </div>
  <div class="tools">
    <label class="toggle"><input type="checkbox" id="hideDone"> 完了を隠す</label>
    <button class="btn" id="exportBtn">書出</button>
    <button class="btn" id="importBtn">読込</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>
<div class="hint">出す→整理→処理：Appleメモで行頭に「★」を付けると<b>未分類</b>に届きます。ドラッグで象限へ。完了でXP獲得⚡</div>
<div class="board" id="board"></div>

<details class="routine" id="routineBox">
  <summary>常にやること（ルーティン）</summary>
  <div class="rlist" id="rlist"></div>
  <button class="addbtn" id="addRoutine" style="margin:6px 0 0; align-self:flex-start">+ ルーティンを追加</button>
</details>
<div id="confetti"></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyARqWam0TKzMV57cy4GxwCzHtRlfSI51vQ",
  authDomain: "yuta-s-tasks.firebaseapp.com",
  projectId: "yuta-s-tasks",
  storageBucket: "yuta-s-tasks.firebasestorage.app",
  messagingSenderId: "24897905739",
  appId: "1:24897905739:web:25c59b70c853a5e85959ce"
};
let _docRef=null,_setDoc=null,_onSnapshot=null,_cloudReady=false;
let _pushTimer=null,_editing=false,_pendingRemote=null,_applyingRemote=false;
try{
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const _db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
  _docRef = fs.doc(_db,"board","main"); _setDoc=fs.setDoc; _onSnapshot=fs.onSnapshot; _cloudReady=true;
}catch(e){ console.warn("Firebase読み込み失敗。ローカルのみで動作。",e); }

const CATS=["SNS","セールス","イベント","RA対応","広告","コミュニティ","事業推進","HR","その他"];
const COLS=[
  {key:"inbox",badge:"📥 未分類",sub:"出す→整理"},
  {key:"q1",badge:"① 重要×緊急",sub:"今すぐ"},
  {key:"q2",badge:"② 重要×緊急でない",sub:"計画する"},
  {key:"q3",badge:"③ 緊急×重要でない",sub:"手早く/任せる"},
  {key:"q4",badge:"④ どちらでもない",sub:"後回し/やめる"},
];
const KEY="ushare_board_v3";
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function daysLeft(due){ if(!due) return null; const d=new Date(due+"T00:00:00"); return Math.round((d-today())/86400000); }
function weekStartTime(dt){const x=new Date(dt);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.getTime();}
function isCurrentPeriod(freq,doneAt){ if(!doneAt)return false; const d=new Date(doneAt+"T00:00:00"),now=new Date();
  if(freq==="毎日")return d.toDateString()===now.toDateString();
  if(freq==="毎月")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  return weekStartTime(d)===weekStartTime(now); }
const XP={"高":30,"中":20,"低":10};

const SEED=[
 ["SNS","Liuさんの記事作成、Marinaさんに確認依頼","中","2026-07-17"],
 ["SNS","入居者へのインタビューを行う","中","2026-08-31"],
 ["イベント","早稲田地球感謝祭の内容を詰める","高","2026-07-17"],
 ["イベント","スタートアップワールドカップ報告","中","2026-07-18"],
 ["RA対応","RA報酬額の算定","高","2026-07-17"],
 ["RA対応","RA報酬額をあさこさんに伝えて入金依頼する","高","2026-07-20"],
 ["RA対応","7/31内見対応","高","2026-07-21"],
 ["RA対応","8月のAll RA Meetingの日程決め","中","2026-07-17"],
 ["RA対応","WISE口座でRA報酬の振込","中","2026-07-25"],
 ["RA対応","RAのトレーニング（エスカレ、ゴミ捨てなど）","中","2026-07-23"],
 ["RA対応","RA報酬メモ追記","中","2026-07-21"],
 ["RA対応","整理会の日程調整","中","2026-07-21"],
 ["コミュニティ","予約システムの導入","高","2026-07-16"],
 ["コミュニティ","マグカップ回収","低","2026-07-16"],
 ["コミュニティ","Living Guidelineへの追記","中","2026-07-16"],
 ["コミュニティ","Residents Onboarding Guidebookのフィードバック","中","2026-07-17"],
 ["コミュニティ","Residential Educationの言語化","中","2026-07-20"],
 ["コミュニティ","喫煙ルールについてLiving GuidelineとHousing Ruleを更新","中","2026-07-21"],
 ["コミュニティ","WANGさんに洗濯機に関してケア","中",""],
 ["コミュニティ","洗濯機での下着の使い方についてLiving Guidelineに追記","中",""],
 ["事業推進","国際電話どれがいいプランなのか調査する","高","2026-07-21"],
 ["事業推進","OVAL JAPAN協賛対応","中","2026-07-16"],
 ["事業推進","KING協賛ブック・協賛企業紹介スライド掲載情報の提供","中","2026-07-16"],
 ["事業推進","指定有給を設定する","中","2026-07-22"],
 ["事業推進","10万円以上の物品があるか確認","中","2026-07-22"],
 ["その他","AMEXカードのログインをして明細を確認","中","2026-07-21"],
 ["その他","勉強会を設定する","中","2026-07-21"],
 ["その他","費用一覧をアップデートする","中","2026-07-21"],
];
const SEED_ROUTINE=[["毎週","面談で使える小ネタを更新"],["毎週","週次レビュー：4象限を見直し、締切を引き直す"],["毎日","RA・入居者の連絡/問い合わせを確認"],["毎月","PMBM Notice を展開"]];
function autoQuad(pri,due){ const d=daysLeft(due); const urgent=d!==null&&d<=2; const important=pri==="高";
  if(important&&urgent)return"q1"; if(important)return"q2"; if(urgent)return"q3"; return"q4"; }

const $=s=>document.querySelector(s);
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.tasks){ normalize(s); return s; }}catch(e){}
  return normalize({
    tasks:SEED.map(t=>({id:uid(),cat:t[0],title:t[1],pri:t[2],due:t[3]||"",done:false,quad:autoQuad(t[2],t[3])})),
    routines:SEED_ROUTINE.map(r=>({id:uid(),freq:r[0],text:r[1],doneAt:""})),
  });
}
function normalize(s){
  s.tasks=s.tasks||[]; s.routines=s.routines||[];
  s.stats=s.stats||{xp:0,today:0,todayDate:todayStr()};
  s.seenInbox=s.seenInbox||[];
  s.routines.forEach(r=>{ if(r.doneAt===undefined) r.doneAt=r.done?todayStr():""; });
  if(s.stats.todayDate!==todayStr()){ s.stats.today=0; s.stats.todayDate=todayStr(); }
  return s;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); setStamp("保存済"); if(!_applyingRemote) cloudPush(); }
function setStamp(p){ $("#stamp").textContent=p+" "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); }
function cloudPush(){ if(!_cloudReady)return; clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ _setDoc(_docRef,{data:JSON.stringify(payload()),ts:Date.now()})
    .then(()=>setStamp("☁ 同期済")).catch(e=>{console.warn("push",e);setStamp("⚠ 同期エラー");}); },400); }
function payload(){ return {tasks:state.tasks,routines:state.routines,stats:state.stats,seenInbox:state.seenInbox}; }

function dueClass(due){const d=daysLeft(due);if(d===null)return"";if(d<0)return"due-late";if(d<=2)return"due-soon";return"";}

function render(){
  const board=$("#board"); board.innerHTML="";
  for(const col of COLS){
    const items=state.tasks.filter(t=>t.quad===col.key && !(state.hideDone&&t.done));
    items.sort((a,b)=>(a.done-b.done));
    const sec=document.createElement("section"); sec.className="col "+col.key;
    sec.innerHTML=`<div class="col-head"><span class="badge">${col.badge}</span><span class="sub">${col.sub}</span><span class="cnt">${state.tasks.filter(t=>t.quad===col.key&&!t.done).length}</span></div>`;
    const list=document.createElement("div"); list.className="list"; list.dataset.q=col.key;
    items.forEach(t=>list.appendChild(card(t)));
    sec.appendChild(list);
    const add=document.createElement("button"); add.className="addbtn"; add.textContent="＋ 追加";
    add.onclick=()=>{ const nt={id:uid(),cat:"その他",title:"新しいタスク",pri:"中",due:"",done:false,quad:col.key}; state.tasks.push(nt); save(); render();
      setTimeout(()=>{const el=document.querySelector(`[data-id="${nt.id}"] .title`); if(el&&el._enterEdit)el._enterEdit();},0); };
    sec.appendChild(add);
    setupDrop(list); board.appendChild(sec);
  }
  renderGami(); renderRoutine();
}

function card(t){
  const el=document.createElement("div");
  const dl=daysLeft(t.due), overdue=dl!==null&&dl<0&&!t.done;
  el.className="card pri-"+t.pri+(t.done?" done":"")+(overdue?" overdue":"");
  el.dataset.id=t.id;
  const flag=overdue?`<span class="flag late">${-dl}日超過</span>`:(dl===0&&!t.done?`<span class="flag today">本日</span>`:"");
  el.innerHTML=`<div class="row1"><span class="handle" title="ドラッグで移動">⠿</span>
    <input class="chk" type="checkbox" ${t.done?"checked":""}>
    <div class="title" contenteditable="false" spellcheck="false" title="クリックで編集"></div>
    <button class="del">×</button></div>
    <div class="meta">
      <select class="cat">${CATS.map(c=>`<option ${c===t.cat?"selected":""}>${c}</option>`).join("")}</select>
      <select class="pri">${["高","中","低"].map(p=>`<option ${p===t.pri?"selected":""}>${p}</option>`).join("")}</select>
      <input class="due ${dueClass(t.due)}" type="date" value="${t.due||""}">${flag}
    </div>`;
  const title=el.querySelector(".title"); title.textContent=t.title;
  el.querySelector(".chk").onchange=e=>{ toggleDone(t,e.target.checked,el); };
  el.querySelector(".del").onclick=()=>{ if(confirm("削除しますか？")){ state.tasks=state.tasks.filter(x=>x.id!==t.id); save(); render(); } };
  // タイトルは「クリックで編集」。編集中だけドラッグを止める（IME・テキスト選択のため）
  function enterEdit(){ if(title.getAttribute("contenteditable")==="true")return; title.setAttribute("contenteditable","true"); el.draggable=false;
    title.focus(); const r=document.createRange(); r.selectNodeContents(title); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  title._enterEdit=enterEdit;
  title.addEventListener("click",enterEdit);
  title.onblur=()=>{ title.setAttribute("contenteditable","false"); el.draggable=true; t.title=title.textContent.trim()||"（無題）"; save(); };
  title.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); title.blur(); } };
  el.querySelector(".cat").onchange=e=>{ t.cat=e.target.value; save(); };
  el.querySelector(".pri").onchange=e=>{ t.pri=e.target.value; el.className="card pri-"+t.pri+(t.done?" done":"")+(overdue?" overdue":""); save(); };
  el.querySelector(".due").onchange=e=>{ t.due=e.target.value; save(); render(); };
  // カード全体をドラッグ可能。編集中(draggable=false)と入力系からのドラッグは無効
  el.draggable=true;
  el.addEventListener("mousedown",ev=>{ if(title.getAttribute("contenteditable")!=="true") el.draggable=true; });
  el.addEventListener("dragstart",ev=>{
    if(el.draggable===false || ev.target.closest('input,select,textarea,button')){ ev.preventDefault(); return; }
    ev.dataTransfer.setData("text/plain",t.id); ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setDragImage(el,20,15); el.classList.add("dragging");
  });
  el.addEventListener("dragend",()=>el.classList.remove("dragging"));
  return el;
}

function toggleDone(t,checked,el){
  t.done=checked;
  if(checked && !t.xpAwarded){ t.xpAwarded=true; state.stats.xp+=(XP[t.pri]||15);
    if(state.stats.todayDate!==todayStr()){state.stats.today=0;state.stats.todayDate=todayStr();}
    state.stats.today++; confetti(el); if(el) el.classList.add("pop"); }
  else if(!checked && t.xpAwarded){ t.xpAwarded=false; state.stats.xp=Math.max(0,state.stats.xp-(XP[t.pri]||15)); state.stats.today=Math.max(0,state.stats.today-1); }
  save(); renderGami(); setTimeout(render,220);
}

function renderGami(){
  const xp=state.stats.xp||0; const lv=Math.floor(xp/100)+1; const pct=xp%100;
  $("#lv").textContent=lv; $("#xp").textContent=xp; $("#xpfill").style.width=pct+"%"; $("#todayc").textContent=state.stats.today||0;
}

function setupDrop(list){
  list.addEventListener("dragover",ev=>{ ev.preventDefault(); list.classList.add("dragover");
    const after=afterElement(list,ev.clientY); const dragging=document.querySelector(".card.dragging");
    if(!dragging)return; if(after==null)list.appendChild(dragging); else list.insertBefore(dragging,after); });
  list.addEventListener("dragleave",()=>list.classList.remove("dragover"));
  list.addEventListener("drop",ev=>{ ev.preventDefault(); list.classList.remove("dragover");
    const id=ev.dataTransfer.getData("text/plain"); const t=state.tasks.find(x=>x.id===id); if(!t)return;
    const order=[...list.querySelectorAll(".card")].map(c=>c.dataset.id);
    const inQ=order.map(oid=>state.tasks.find(x=>x.id===oid)).filter(Boolean);
    const others=state.tasks.filter(x=>x.quad!==list.dataset.q && x.id!==id);
    inQ.forEach(x=>x.quad=list.dataset.q);
    state.tasks=others.concat(inQ); save(); render(); });
}
function afterElement(list,y){ const cards=[...list.querySelectorAll(".card:not(.dragging)")]; let best={o:-Infinity,el:null};
  for(const c of cards){ const b=c.getBoundingClientRect(); const o=y-b.top-b.height/2; if(o<0&&o>best.o)best={o,el:c}; } return best.el; }

function renderRoutine(){
  const rl=$("#rlist"); rl.innerHTML="";
  state.routines.forEach(r=>{ const checked=isCurrentPeriod(r.freq,r.doneAt);
    const it=document.createElement("div"); it.className="ritem"+(checked?" done":"");
    it.innerHTML=`<input type="checkbox" ${checked?"checked":""}>
      <select class="freq-sel">${["毎日","毎週","毎月"].map(f=>`<option ${f===r.freq?"selected":""}>${f}</option>`).join("")}</select>
      <div class="rtext" contenteditable="true" spellcheck="false"></div><span class="rnext"></span><button class="del">×</button>`;
    it.querySelector(".rtext").textContent=r.text;
    it.querySelector(".rnext").textContent=checked?(r.freq==="毎日"?"明日また":r.freq==="毎週"?"来週また":"来月また"):"";
    it.querySelector("input").onchange=e=>{ r.doneAt=e.target.checked?todayStr():""; save(); renderRoutine(); };
    it.querySelector(".freq-sel").onchange=e=>{ r.freq=e.target.value; save(); renderRoutine(); };
    const rt=it.querySelector(".rtext"); rt.onblur=()=>{ r.text=rt.textContent.trim()||"（無題）"; save(); };
    it.querySelector(".del").onclick=()=>{ state.routines=state.routines.filter(x=>x.id!==r.id); save(); renderRoutine(); };
    rl.appendChild(it); });
}
$("#addRoutine").onclick=()=>{ state.routines.push({id:uid(),freq:"毎週",text:"新しいルーティン",doneAt:""}); save(); renderRoutine(); };

// ---- 演出：紙吹雪 ----
function confetti(anchor){
  const box=$("#confetti"); const rect=anchor?anchor.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const colors=["#f5a623","#e5484d","#3e63dd","#30a46c","#8e4ec6","#f6c453"];
  for(let i=0;i<18;i++){ const p=document.createElement("div"); p.className="confetti-p";
    p.style.background=colors[i%colors.length]; p.style.left=cx+"px"; p.style.top=cy+"px";
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-40;
    p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${dy+90}px) rotate(${Math.random()*540}deg)`,opacity:0}],
      {duration:700+Math.random()*400,easing:"cubic-bezier(.2,.7,.3,1)"});
    box.appendChild(p); setTimeout(()=>p.remove(),1200); }
}

// ---- ★メモ取り込み（未分類へ） ----
async function pullInbox(){
  try{
    const res=await fetch("inbox.json?t="+Date.now(),{cache:"no-store"}); if(!res.ok)return;
    const items=await res.json(); let changed=false;
    for(const it of items){ if(state.seenInbox.includes(it.srcId))continue;
      state.tasks.push({id:uid(),cat:it.cat||"その他",title:it.title,pri:it.pri||"中",due:it.due||"",done:false,quad:"inbox",srcId:it.srcId});
      state.seenInbox.push(it.srcId); changed=true; }
    if(changed){ save(); render(); }
  }catch(e){ /* ローカルfile:等では取得不可。無視 */ }
}

// ---- Firestore 同期 ----
function applyRemote(r){ _applyingRemote=true; state.tasks=r.tasks||[]; state.routines=r.routines||[];
  state.stats=r.stats||state.stats; state.seenInbox=r.seenInbox||state.seenInbox; normalize(state);
  localStorage.setItem(KEY,JSON.stringify(state)); render(); _applyingRemote=false; }
document.addEventListener("focusin",e=>{ if(e.target.closest(".card, .ritem"))_editing=true; });
document.addEventListener("focusout",e=>{ if(e.target.closest(".card, .ritem")){_editing=false; if(_pendingRemote){applyRemote(_pendingRemote);_pendingRemote=null;}} });

const hd=$("#hideDone"); hd.checked=!!state.hideDone; hd.onchange=()=>{ state.hideDone=hd.checked; localStorage.setItem(KEY,JSON.stringify(state)); render(); };
$("#exportBtn").onclick=()=>{ const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="ushare_tasks_"+todayStr()+".json"; a.click(); };
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(s.tasks){ state=normalize(s); save(); render(); alert("読み込みました"); } }catch(err){ alert("読み込めません: "+err); } }; r.readAsText(f); };

render();
if(_cloudReady){
  _onSnapshot(_docRef,snap=>{
    if(!snap.exists()){ cloudPush(); return; }
    let r; try{ r=JSON.parse(snap.data().data); }catch(e){ return; }
    if(JSON.stringify(r)===JSON.stringify(payload())){ setStamp("☁ 同期済"); return; }
    if(_editing){ _pendingRemote=r; return; }
    applyRemote(r); setStamp("☁ 受信");
  },err=>{ console.warn("snapshot",err); setStamp("⚠ 同期エラー"); });
} else setStamp("ローカルのみ");

pullInbox(); setInterval(pullInbox,60000);
</script>
